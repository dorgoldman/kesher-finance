name: Content check

on:
  pull_request:
    paths:
      - 'src/app/guides/**'
      - 'src/lib/guides.ts'
  push:
    branches: [main]
    paths:
      - 'src/app/guides/**'
      - 'src/lib/guides.ts'

jobs:
  check-content:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/check-content.mjs
